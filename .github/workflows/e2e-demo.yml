name: SIGH E2E Demo

# Telas com DADOS DE DEMONSTRAÇÃO (SIGH/frontend/e2e-demo, Playwright + Chromium): acessibilidade (axe-core, temas
# escuro e claro) e nenhum termo em inglês (temas escuro e claro), contra a stack EM CONTAINERS com o seed de
# demonstração (compose.app.yml + compose.e2e.yml + compose.e2e-demo.yml), com segredos gerados no próprio job
# (scripts/e2e-stack.sh --demo). Mesmo modelo do workflow e2e.yml. As capturas (screenshots.spec) só rodam quando
# pedidas à mão (Actions → SIGH E2E Demo → Run workflow, "screenshots" marcado): saem como o artefato "capturas-telas",
# para serem conferidas e versionadas em SIGH/docs/telas.
on:
  # Na main, só quando muda algo que a suíte exercita (o PR já rodou antes do merge).
  push:
    branches: [ main ]
    paths:
      - 'SIGH/**'
      - 'compose.app.yml'
      - 'compose.e2e.yml'
      - 'compose.e2e-demo.yml'
      - 'scripts/e2e-stack.sh'
      - '.github/workflows/e2e-demo.yml'
  # Em TODO PR para a main, sem filtro de caminhos (o check sempre aparece, como o do e2e.yml).
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      screenshots:
        description: 'Gerar também as capturas de SIGH/docs/telas (artefato "capturas-telas")'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-demo:
    # Nome do check no PR. NÃO está marcado como obrigatório na proteção da main (decisão do dono do repositório).
    name: E2E Demo (acessibilidade e nenhum termo em inglês)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SIGH/frontend/package-lock.json

      - name: Install Dependencies
        working-directory: SIGH/frontend
        run: npm ci

      - name: Install Chromium (Playwright)
        working-directory: SIGH/frontend
        run: npx playwright install --with-deps chromium

      # Sobe a stack com o seed de demonstração, roda o setup (troca de senha do administrador), a acessibilidade e o
      # "nenhum termo em inglês" nos dois temas, e desmonta tudo, passando ou falhando.
      - name: Run E2E Demo against the compose stack
        run: scripts/e2e-stack.sh --demo e2e-demo/setup.spec.ts e2e-demo/accessibility.spec.ts e2e-demo/no-english.spec.ts

      # Só no disparo manual com "screenshots": a mesma stack de demonstração, só o screenshots.spec (ele não pode rodar
      # junto do no-english, que cria um usuário fictício que apareceria nas capturas).
      - name: Generate screenshots (SIGH/docs/telas)
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        env:
          SIGH_SCREENSHOTS: '1'
        run: scripts/e2e-stack.sh --demo e2e-demo/screenshots.spec.ts

      - name: Upload screenshots
        if: github.event_name == 'workflow_dispatch' && inputs.screenshots
        uses: actions/upload-artifact@v4
        with:
          name: capturas-telas
          path: SIGH/docs/telas/*.png
          retention-days: 14

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-demo
          path: |
            SIGH/frontend/playwright-report/
            SIGH/frontend/test-results/
          retention-days: 14
